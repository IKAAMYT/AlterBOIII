name: AlterBOIII CI

# Compile a chaque push sur une branche, SANS creer de release.
# Le workflow de release (alterbo3-release.yml) reste reserve aux tags v*.
# But : ne plus avoir a cliquer "Run workflow" a la main.
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    # Inutile de relancer 30 min de build pour un fichier serveur ou un README.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/amis/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: alterboiii-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (Release)
    runs-on: windows-2022
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          msdev: vs2022

      - name: Generate project files
        run: premake5 vs2022

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build Release
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=ClangCL build/boiii.sln

      - name: Stage package
        shell: bash
        run: |
          mkdir -p package
          cp build/bin/x64/Release/boiii.exe package/AlterBOIII.exe
          cp -r data package/data
          rm -rf package/data/launcher
          cd package
          7z a -tzip ../AlterBO3.zip ./*
          cd ..
          cp build/bin/x64/Release/boiii.exe AlterBOIII.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlterBO3-ci
          path: |
            AlterBO3.zip
            AlterBOIII.exe
          retention-days: 14

      # Si la compilation casse, on veut le detail dans le resume du build
      # plutot que d'avoir a fouiller 3000 lignes de log.
      - name: Resume en cas d'echec
        if: failure()
        shell: bash
        run: |
          {
            echo "## Build en echec"
            echo ""
            echo "Branche : \`${GITHUB_REF#refs/heads/}\`"
            echo "Commit  : \`${GITHUB_SHA:0:8}\`"
            echo ""
            echo "Ouvre l'etape **Build Release** ci-dessus et cherche les lignes \`error\`."
          } >> "$GITHUB_STEP_SUMMARY"
