name: AlterBO3 Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (ex: v1.0.0) — lettres, chiffres, . - _ uniquement, pas d'espace"
        required: false
        default: ''

concurrency:
  group: alterbo3-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------
  # 0. Valide le tag AVANT de compiler (evite 30 min de build pour rien)
  # ---------------------------------------------------------------
  validate:
    name: Validate tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Resolve & validate tag
        id: resolve
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "Tag demande : '$TAG'"

          if [ -z "$TAG" ]; then
            echo "::error::Aucun tag fourni. Lance avec un tag (ex: v1.0.0)."
            exit 1
          fi
          if printf '%s' "$TAG" | grep -qE '[[:space:]]'; then
            echo "::error::Le tag '$TAG' contient un espace. GitHub refuse les espaces. Utilise par ex. v2.0.0"
            exit 1
          fi
          if ! printf '%s' "$TAG" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::Le tag '$TAG' contient un caractere interdit. Autorise : A-Z a-z 0-9 . _ - /"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag valide : $TAG"

  # ---------------------------------------------------------------
  # 1. Build (Windows / ClangCL)
  # ---------------------------------------------------------------
  build:
    name: Build AlterBO3 (Release)
    needs: validate
    # Ezz compile desormais en C++23 complet : il faut VS 2026 (runner
    # windows-2025), premake "vs2026" et la solution au format .slnx.
    runs-on: windows-2025
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          lfs: false

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          # '[18.0,)' = VS 2026 (support C++23 complet)
          vs-version: "[18.0,)"

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          msdev: vs2026

      - name: Generate project files
        run: premake5 vs2026

      - name: Set up problem matching
        uses: ammaraskar/msvc-problem-matcher@master

      - name: Build Release
        run: msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 /p:PlatformToolset=ClangCL build/boiii.slnx

      - name: Stage AlterBO3 package
        shell: bash
        run: |
          mkdir -p package
          cp build/bin/x64/Release/boiii.exe package/AlterBOIII.exe
          # Copy data/ but EXCLUDE data/launcher (the launcher UI is downloaded
          # automatically on first run, so it doesn't need to ship in the zip).
          cp -r data package/data
          rm -rf package/data/launcher
          cd package
          7z a -tzip ../AlterBO3.zip ./*
          cd ..
          # Also ship the standalone exe (update.json -> exe_url).
          cp build/bin/x64/Release/boiii.exe AlterBOIII.exe
          # Version compilee (tagName de premake5.lua), comparee au tag avant
          # de publier update.json.
          grep -oE 'tagName = "[0-9.]+"' premake5.lua | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' > built_version.txt
          echo "Version compilee : $(cat built_version.txt)"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlterBO3
          path: |
            AlterBO3.zip
            AlterBOIII.exe
            built_version.txt

  # ---------------------------------------------------------------
  # 2. Release GitHub
  # ---------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [validate, build]
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: AlterBO3
          path: dist

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: AlterBO3 ${{ needs.validate.outputs.tag }}
          files: |
            dist/AlterBO3.zip
            dist/AlterBOIII.exe
          generate_release_notes: true
          body: |
            **AlterBOIII** — client Black Ops III de l'equipe AlterCOD.
            Decompresse `AlterBO3.zip` dans ton dossier Black Ops III et lance `AlterBOIII.exe`.
            Depuis la 2.4.0, AlterBOIII se met a jour tout seul au lancement.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Auto-update : update.json (branche main) annonce la nouvelle version
      # aux clients 2.4.0+. Uniquement pour un tag X.Y.Z / vX.Y.Z egal a la
      # version compilee : sinon les clients retelechargeraient en boucle un
      # exe qui se croit plus ancien.
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo

      - name: Publish update.json
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          VERSION="${TAG#v}"
          BUILT="$(cat dist/built_version.txt 2>/dev/null || true)"
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' : pas une version X.Y.Z, update.json inchange."
            exit 0
          fi
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::warning::Tag $TAG mais version compilee '$BUILT' (premake5.lua) : update.json inchange. Mets tagName a $VERSION puis relance."
            exit 0
          fi
          SHA1="$(sha1sum dist/AlterBOIII.exe | cut -d' ' -f1)"
          SIZE="$(stat -c%s dist/AlterBOIII.exe)"
          URL="https://github.com/IKAAMYT/AlterBOIII/releases/download/${TAG}/AlterBOIII.exe"
          printf '{\n  "version": "%s",\n  "exe_url": "%s",\n  "exe_sha1": "%s",\n  "exe_size": %s,\n  "ui_version": "%s"\n}\n' \
            "$VERSION" "$URL" "$SHA1" "$SIZE" "$VERSION" > repo/update.json
          cat repo/update.json
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json deja a jour."
            exit 0
          fi
          git commit -m "update.json : AlterBOIII $VERSION (auto-update)"
          git push origin HEAD:main
